<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Bem-vindo ao meu GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16031f"/>
      <stop offset="1" stop-color="#090010"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#ff7ab8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2cbf"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="0.55" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#b86bff"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#9d4edd"/>
    </linearGradient>
    <clipPath id="clip"><rect x="3" y="3" width="1194" height="294" rx="26"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" d="M0,-22 C2,-6 6,-2 22,0 C6,2 2,6 0,22 C-2,6 -6,2 -22,0 C-6,-2 -2,-6 0,-22Z"/>
  </defs>

  <rect width="1200" height="300" rx="28" fill="#0d0d0d"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- blobs esquerda -->
    <path d="M0,0 L520,0 C470,60 380,70 300,95 C210,125 150,90 90,130 C50,155 20,150 0,175 Z" fill="url(#pink)" opacity="0.92"/>
    <path d="M0,0 L330,0 C300,40 220,50 150,70 C90,85 40,72 0,105 Z" fill="url(#violet)" opacity="0.9"/>
    <circle cx="90" cy="290" r="58" fill="url(#pink)" opacity="0.9"/>

    <!-- blobs direita -->
    <path d="M1200,300 L1200,90 C1140,110 1110,170 1030,200 C960,225 900,260 860,300 Z" fill="url(#pink)" opacity="0.92"/>
    <path d="M1200,300 L1200,175 C1160,192 1120,232 1070,262 C1040,280 1010,290 990,300 Z" fill="url(#violet)" opacity="0.9"/>
    <circle cx="1095" cy="18" r="72" fill="url(#violet)" opacity="0.95"/>

    <!-- curvas e nós -->
    <g fill="none" stroke="#ffd1ea" stroke-opacity="0.45" stroke-width="1.4">
      <path d="M250,70 C310,150 390,170 440,255"/>
      <path d="M520,0 C640,25 700,10 760,0" stroke-opacity="0.25"/>
      <path d="M930,0 C970,70 1020,95 1045,175"/>
      <path d="M760,300 C830,270 900,280 960,240" stroke-opacity="0.3"/>
    </g>
    <g fill="#ff2e93">
      <rect x="244" y="64" width="12" height="12" transform="rotate(45 250 70)"/>
      <rect x="434" y="249" width="12" height="12" transform="rotate(45 440 255)"/>
      <rect x="1039" y="169" width="12" height="12" transform="rotate(45 1045 175)"/>
      <rect x="924" y="-6" width="12" height="12" transform="rotate(45 930 0)"/>
    </g>

    <!-- brilhos -->
    <g fill="#ff2e93" filter="url(#glow)">
      <use href="#star" x="330" y="165" transform="translate(330 165) scale(1.1) translate(-330 -165)"/>
      <use href="#star" x="880" y="105"/>
      <use href="#star" x="935" y="165" transform="translate(935 165) scale(0.6) translate(-935 -165)"/>
    </g>

    <!-- setinhas decorativas -->
    <g fill="#ffe3f3" opacity="0.9"><path d="M1118,52 l10,-6 v12 z"/><circle cx="1140" cy="52" r="4"/><path d="M1162,46 l10,6 l-10,6 z"/></g>

    <!-- texto -->
    <g font-family="'Arial Black','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" text-anchor="middle">
      <text x="600" y="130" font-size="60" fill="#ffe3f3">BEM-VINDO AO MEU</text>
      <text x="600" y="222" font-size="104" fill="url(#txt)">GITHUB</text>
    </g>
  </g>

  <rect x="3" y="3" width="1194" height="294" rx="26" fill="none" stroke="url(#border)" stroke-width="4"/>
</svg>
